name: Skill bug report
description: Report a reproducible problem in a SandBase Skill
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For security vulnerabilities, use the private reporting link in SECURITY.md instead.
  - type: input
    id: skill
    attributes:
      label: Skill
      description: Skill identifier and installed version or commit.
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and environment
      description: For example Codex, Claude Code, Cursor, Gemini CLI, or DeepSeek Harness, plus OS.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reproducible prompt and steps. Remove secrets and personal data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

