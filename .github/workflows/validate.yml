name: Validate Skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate skill catalog and contracts
        run: npm run validate
      - name: Run JavaScript and Python tests
        run: npm test
      - name: Validate generated Agent Plugin
        run: npm run agent-plugin:check
      - name: Validate Claude Code marketplace
        run: npm run marketplace:check
      - name: Audit package contents
        run: npm run package:check
